<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Title and description are rewritten by lessons.js once the lesson loads. -->
  <title>Lesson | NextGen Engineering</title>
  <meta name="description" content="A free step by step engineering lesson from NextGen Engineering.">

  <meta property="og:type" content="article">
  <meta property="og:site_name" content="NextGen Engineering">
  <meta name="theme-color" content="#3B464A">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" href="files/images/logo-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">

<body>
  <a class="btn btn--primary visually-hidden" href="#main">Skip to content</a>

  <div data-include="header"></div>

  <main id="main">

    <section class="section" id="lesson-body"></section>

          <h2>Related lessons</h2>
        </div>
        <div class="grid grid--3" id="related-grid"></div>

    </section>
  </main>

  <div data-include="footer"></div>

  <script src="script.js"></script>
  <script src="lessons.js"></script>

</html>
